services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dump:/backup
  phpmyadmin:
    image: phpmyadmin # the official image
    ports:
      - "8336:80"
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
    depends_on:
      - db
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.36.0
    container_name: swagger-ui
    ports:
      - "8081:8080" # host 8080 is the Go API
    volumes:
      # Only the bundled spec: the image flattens SWAGGER_ROOT, so split files' relative $refs would break.
      - ./apidocs/dist:/mnt:ro
    environment:
      - SWAGGER_JSON=/mnt/api.yaml

volumes:
  mysql_data:
    driver: local